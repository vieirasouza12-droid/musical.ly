<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>musical.ly</title>
</head>

<body>
  <h1>🎵 musical.ly 🎵</h1>

  <!-- Barra de Pesquisa Rosa Claro -->
  <div class="caixa-pesquisa">
    <input type="search" class="barra-busca" placeholder="Pesquise por Funk, Sertanejo, Pop...">
    <button class="botao-busca">🔍 Buscar</button>
  </div>

  <h2>🔥 Funk</h2>

  <!-- Cartão de Música Individual -->
  <div class="card-musica">
    <iframe src="https://www.youtube.com/embed/TQ5DUv_ZwRg?list=RDTQ5DUv_ZwRg"
      title="Acústico 1Kilo - Deixe-me Ir" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>

    <div class="interacao">
      <button class="botao-curtir" onclick="curtir(this)">❤️ <span class="contador">0</span> Curtidas</button>
      <div class="comentarios">
        <input type="text" class="campo-comentario" placeholder="Escreva um comentário...">
        <button class="botao-enviar" onclick="adicionarComentario(this)">Comentar</button>
      </div>
      <div class="lista-comentarios"></div>
    </div>
  </div>

  <div class="card-musica">
    <iframe src="https://www.youtube.com/embed/nNHVTuST8eA?list=RDnNHVTuST8eA"
      title="Cuida do Pet" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>

    <div class="interacao">
      <button class="botao-curtir" onclick="curtir(this)">❤️ <span class="contador">0</span> Curtidas</button>
      <div class="comentarios">
        <input type="text" class="campo-comentario" placeholder="Escreva um comentário...">
        <button class="botao-enviar" onclick="adicionarComentario(this)">Comentar</button>
      </div>
      <div class="lista-comentarios"></div>
    </div>
  </div>

  <h2>🤠 Sertanejo</h2>

  <div class="card-musica">
    <iframe src="https://www.youtube.com/embed/uPLztx0LcYA?list=RDuPLztx0LcYA"
      title="Luan Santana - Garotas Não Merecem Chorar" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>

    <div class="interacao">
      <button class="botao-curtir" onclick="curtir(this)">❤️ <span class="contador">0</span> Curtidas</button>
      <div class="comentarios">
        <input type="text" class="campo-comentario" placeholder="Escreva um comentário...">
        <button class="botao-enviar" onclick="adicionarComentario(this)">Comentar</button>
      </div>
      <div class="lista-comentarios"></div>
    </div>
  </div>

  <h2>✨ Pop</h2>

  <div class="card-musica">
    <iframe src="https://www.youtube.com/embed/3yy-dKTmyOo?list=RD3yy-dKTmyOo"
      title="Milo Manheim, Meg Donnelly - Someday" frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen></iframe>

    <div class="interacao">
      <button class="botao-curtir" onclick="curtir(this)">❤️ <span class="contador">0</span> Curtidas</button>
      <div class="comentarios">
        <input type="text" class="campo-comentario" placeholder="Escreva um comentário...">
        <button class="botao-enviar" onclick="adicionarComentario(this)">Comentar</button>
      </div>
      <div class="lista-comentarios"></div>
    </div>
  </div>

  <!-- Código JavaScript para fazer os botões funcionarem -->
  <script>
    function curtir(botao) {
      let contadorSpan = botao.querySelector('.contador');
      let curtidasAtuais = parseInt(contadorSpan.textContent);
      contadorSpan.textContent = curtidasAtuais + 1;
    }

    function adicionarComentario(botao) {
      let divInteracao = botao.parentElement.parentElement;
      let campoTexto = divInteracao.querySelector('.campo-comentario');
      let listaComentarios = divInteracao.querySelector('.lista-comentarios');

      if (campoTexto.value.trim() !== "") {
        let novoComentario = document.createElement('p');
        novoComentario.className = 'item-comentario';
        novoComentario.textContent = campoTexto.value;
        listaComentarios.appendChild(novoComentario);
        campoTexto.value = "";
      }
    }
  </script>
</body>

</html>
